name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: 'yes'

      - name: Build, test, and verify coverage
        id: gradle-build
        continue-on-error: true
        run: ./gradlew clean build --scan

      - name: Publish coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("build/reports/jacoco/test/jacocoTestReport.xml")
          if not report.exists():
              print("## Code Coverage")
              print()
              print("Coverage report was not generated.")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {
              counter.attrib["type"]: counter.attrib
              for counter in root.findall("counter")
          }

          print("## Code Coverage")
          print()
          print("| Metric | Covered | Missed | Coverage |")
          print("| --- | ---: | ---: | ---: |")
          for metric in ("LINE", "BRANCH", "INSTRUCTION"):
              counter = counters[metric]
              missed = int(counter["missed"])
              covered = int(counter["covered"])
              total = missed + covered
              pct = 100.0 * covered / total if total else 100.0
              print(f"| {metric.title()} | {covered} | {missed} | {pct:.2f}% |")
          print()
          print("Full HTML and XML reports are attached as build artifacts.")
          PY

      - name: Publish build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-access-control-jars
          path: |
            build/libs/*.jar
            build/reports/jacoco/test/html/**
          if-no-files-found: warn

      - name: Fail if Gradle build failed
        if: steps.gradle-build.outcome != 'success'
        run: exit 1
